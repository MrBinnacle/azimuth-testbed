[build]
  base    = "testbed"
  command = "npm run build"
  publish = "testbed/dist"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy      = "default-src 'self'; script-src 'self'; connect-src https://api.anthropic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none';"
    X-Frame-Options              = "DENY"
    X-Content-Type-Options       = "nosniff"
    Referrer-Policy              = "strict-origin-when-cross-origin"
    Permissions-Policy           = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), interest-cohort=(), display-capture=(), clipboard-read=()"
    Strict-Transport-Security    = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy   = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
