name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 12:00 UTC. Runs npm audit against the locked deps so newly-published
    # alerts are caught without waiting for a push. Closes the false-negative trap that
    # caused commit 58332db to flip CI red — audit step only fires on push by default.
    - cron: '0 12 * * 1'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: testbed/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: testbed

      - name: Test (extraction harness)
        run: npm test
        working-directory: testbed

      - name: Build
        run: npm run build
        working-directory: testbed

      - name: Audit (HIGH/CRITICAL only)
        run: npm audit --audit-level=high
        working-directory: testbed
